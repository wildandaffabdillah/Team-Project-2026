<link rel="stylesheet" href="css/style.css">

<div class="dashboard">

  <div class="header">
    <h2>PPE Monitoring Dashboard</h2>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Total Workers</h3>
      <p>20</p>
    </div>

    <div class="card">
      <h3>Violations</h3>
      <p>5</p>
    </div>

    <div class="card">
      <h3>Safe Workers</h3>
      <p>15</p>
    </div>
  </div>

  <div class="card">
    <h3>Chart</h3>
    <canvas id="chart"></canvas>
  </div>

  <div class="card">
    <h3>Alerts</h3>
    <div id="alerts"></div>
  </div>

</div>
